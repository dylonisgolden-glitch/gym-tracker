<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gym Tracker</title>
<style>
:root{--bg:#0a0e13;--panel:#111821;--panel2:#161f2b;--line:#1f2b3a;--txt:#e8eef5;--dim:#8494a7;--up:#2ecc71;--down:#ff5d5d;--acc:#4aa8ff;--gold:#f5c542;--nav:62px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;font-feature-settings:"tnum"}
button,input,select,textarea{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input,select,textarea{font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
button{cursor:pointer;transition:.12s}
button:hover{border-color:#34475d}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);border-color:var(--acc);color:#04111f;font-weight:700}
button.dng{color:var(--down)}
button.sm{padding:5px 9px;font-size:13px;border-radius:8px}
button.ghost{background:transparent}
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,14,19,.92);backdrop-filter:blur(10px);z-index:20}
.brand{font-weight:800;letter-spacing:1.5px;font-size:15px}.brand b{color:var(--up)}.brand span{color:var(--dim);font-weight:600}
.tabs{display:flex;gap:4px;flex:1}
.tabs button{background:transparent;border:0;color:var(--dim);padding:8px 12px;border-radius:8px;font-weight:600}
.tabs button.on{color:var(--txt);background:var(--panel2)}
.bnav{display:none}
main{max-width:1040px;margin:0 auto;padding:16px 14px 90px}
h2{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin:0 0 10px;font-weight:700}
h3{margin:0 0 6px;font-size:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.dim{color:var(--dim)}.up{color:var(--up)}.down{color:var(--down)}.gold{color:var(--gold)}
.sm-t{font-size:12.5px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px}
.tile .k{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:700}
.tile .v{font-size:26px;font-weight:800;margin:3px 0}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--acc)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}
.pill.smp{color:var(--gold);border-color:#6b5a1f;background:#2a2410}
.pill.pr{color:#201700;background:var(--gold);border-color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 12px;border-radius:99px;font-weight:600;font-size:13.5px;background:transparent}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#04111f}
.empty{padding:36px 10px;text-align:center;color:var(--dim)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);font-weight:700}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.cwrap{position:relative;user-select:none;-webkit-user-select:none}
.cwrap svg{display:block;width:100%}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--dim);font-size:11px}
svg .ov{fill:transparent;touch-action:pan-y;cursor:crosshair}
.tip{display:none;position:absolute;z-index:5;pointer-events:none;background:#0d141c;border:1px solid #2c3d52;border-radius:10px;padding:8px 10px;font-size:12.5px;min-width:130px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tip b{font-size:15px}
.price{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px}
.bars .b{flex:1;background:#27415f;border-radius:5px 5px 0 0;min-height:3px;cursor:pointer;position:relative;transition:background .1s}
.bars .b.last{background:var(--acc)}
.bars .b:hover,.bars .b.sel{background:var(--up)}
.blab{display:flex;gap:5px;margin-top:4px}
.blab span{flex:1;text-align:center;font-size:10.5px;color:var(--dim);overflow:hidden;white-space:nowrap}
.bcap{min-height:20px;font-size:13px;margin-top:6px;color:var(--dim)}
/* log */
.entry{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--panel2)}
.srow{display:grid;grid-template-columns:24px 1fr 1fr 40px 32px;gap:8px;align-items:center;margin-bottom:8px}
.srow.head{font-size:11px;letter-spacing:.8px;color:var(--dim);text-transform:uppercase;margin-bottom:4px}
.srow.off input{opacity:.45}
.num{display:flex;align-items:stretch}
.num input{width:100%;min-width:0;text-align:center;border-radius:0;font-weight:700;font-size:17px;padding:10px 4px}
.num button{padding:0 11px;border-radius:10px 0 0 10px;font-size:18px;font-weight:700;color:var(--dim)}
.num button:last-child{border-radius:0 10px 10px 0}
.chk{width:30px;height:30px;accent-color:var(--up)}
.sticky{position:sticky;bottom:calc(var(--nav) + 8px);z-index:10;background:rgba(17,24,33,.96);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--dim);text-align:center;padding:4px 0}
.day{aspect-ratio:1/.9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;border-radius:10px;background:transparent;border:1px solid transparent;font-weight:600}
.day:hover{background:var(--panel2)}
.day.today{border-color:#3a5473}
.day.sel{background:var(--acc);color:#04111f;border-color:var(--acc)}
.day .dot{width:7px;height:7px;border-radius:50%;background:var(--up)}
.day .dot.smp{background:transparent;border:1.5px solid var(--gold)}
.day.sel .dot{background:#04111f;border-color:#04111f}
.day.blank{visibility:hidden}
.wc{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel2)}
.wc .ln{font-size:13.5px;padding:2px 0}
.wc .ln s{color:var(--dim)}
.cmpcol{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;font-size:13px}
.banner{background:#2a2410;border-bottom:1px solid #6b5a1f;color:var(--gold);padding:8px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.banner button{color:var(--gold);border-color:#6b5a1f;background:transparent}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 70px);transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:#0d141c;border:1px solid #2c3d52;border-radius:12px;padding:10px 14px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.55);pointer-events:auto;max-width:92vw}
.t.err{border-color:var(--down);color:var(--down)}.t.ok{border-color:var(--up)}
.t button{margin-left:10px;padding:3px 10px}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(520px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.65)}
.set-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:720px){
  .tabs{display:none}
  .top{padding:9px 14px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(10,14,19,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:30}
  .bnav button{flex:1;border:0;background:transparent;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:600;border-radius:0}
  .bnav button i{font-style:normal;font-size:20px;line-height:1}
  .bnav button.on{color:var(--acc)}
  .price{font-size:28px}
  main{padding-bottom:calc(var(--nav) + 90px)}
}
@media(min-width:721px){:root{--nav:0px}.sticky{bottom:10px}#toast{bottom:30px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>&#9650;</b> GYM<span>TRACKER</span></div>
  <nav class="tabs" id="tnav"></nav>
  <div class="sp"></div>
  <button id="gear" class="sm" aria-label="Settings">Settings</button>
</header>
<div id="banner"></div>
<main id="view"></main>
<nav class="bnav" id="bnav"></nav>
<div id="toast"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
/* ============ helpers ============ */
const KG=2.2046226218;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const todayStr=()=>iso(new Date());
const DAY=864e5;
const fdate=s=>pd(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const fshort=s=>pd(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fts=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const r1=n=>Math.round(n*10)/10, r2=n=>Math.round(n*100)/100;
const pct=(a,b)=>b?(a-b)/b*100:null;
const chip=p=>p==null||!isFinite(p)?'<span class="dim">&mdash;</span>':`<span class="${p>=0?'up':'down'}">${p>=0?'&#9650;':'&#9660;'} ${Math.abs(p).toFixed(1)}%</span>`;
const sum=a=>a.reduce((x,y)=>x+y,0);

/* ============ database (IndexedDB) ============ */
let idb;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('gymtracker-db',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('exercises',{keyPath:'id'});d.createObjectStore('workouts',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const txn=(st,mode,fn)=>new Promise((res,rej)=>{const t=idb.transaction(st,mode);fn(t);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const getAll=st=>new Promise((res,rej)=>{const q=idb.transaction(st).objectStore(st).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const dbPut=(st,v)=>txn(st,'readwrite',t=>t.objectStore(st).put(v));
const dbPutMany=(st,a)=>txn(st,'readwrite',t=>a.forEach(v=>t.objectStore(st).put(v)));
const dbDel=(st,k)=>txn(st,'readwrite',t=>t.objectStore(st).delete(k));
const dbDelMany=(st,ks)=>txn(st,'readwrite',t=>ks.forEach(k=>t.objectStore(st).delete(k)));
const dbClear=st=>txn(st,'readwrite',t=>t.objectStore(st).clear());

/* ============ state ============ */
let ex=[],wk=[],EM=new Map();
let cfg={unit:'lb',bw:0,includeSample:true};
const saveCfg=()=>dbPut('meta',{k:'cfg',v:cfg});
let _c={};
function dirty(){_c={};EM=new Map(ex.map(e=>[e.id,e]));wk.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.created-b.created)}
const vis=()=>cfg.includeSample?wk:wk.filter(w=>!w.sample);
const visEx=()=>cfg.includeSample?ex:ex.filter(e=>!e.sample);

/* ============ units ============ */
const toDisp=kg=>cfg.unit==='lb'?kg*KG:kg;
const toKg=v=>cfg.unit==='lb'?v/KG:v;
const nf=(v,d=1)=>(Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toLocaleString(undefined,{maximumFractionDigits:d});
const fw=kg=>nf(toDisp(kg));
const fwu=kg=>fw(kg)+' '+cfg.unit;
const fvol=kg=>Math.round(toDisp(kg)).toLocaleString()+' '+cfg.unit;

/* ============ calculations ============ */
const loadOf=(e,s)=>e&&e.type==='bodyweight'?(cfg.bw||0)+s.w:s.w;          // kg lifted incl. bodyweight if applicable
const e1=(l,r)=>(r<1||r>12||l<=0)?null:(r===1?l:l*(1+r/30));                // Epley, valid to 12 reps
function sessionOf(w,en){
  const e=EM.get(en.exId);const sets=en.sets.filter(s=>s.done!==false&&s.r>0);if(!sets.length)return null;
  let top=0,best=0,vol=0,reps=0,maxReps=0;
  for(const s of sets){const l=loadOf(e,s);top=Math.max(top,l);const x=e1(l,s.r);if(x)best=Math.max(best,x);vol+=l*s.r;reps+=s.r;maxReps=Math.max(maxReps,s.r)}
  return{wid:w.id,date:w.date,t:pd(w.date).getTime(),created:w.created,exId:en.exId,sets,top,e1:best,vol,reps,maxReps,n:sets.length,sample:!!w.sample,note:en.note};
}
function SX(){ if(_c.sx)return _c.sx; const m=new Map(); vis().forEach(w=>w.entries.forEach(en=>{const s=sessionOf(w,en);if(s){if(!m.has(en.exId))m.set(en.exId,[]);m.get(en.exId).push(s)}}));
  m.forEach(a=>a.sort((x,y)=>x.t-y.t||x.created-y.created)); return _c.sx=m}
function allSess(){ if(_c.as)return _c.as; const a=[]; vis().forEach(w=>{const ss=w.entries.map(en=>sessionOf(w,en)).filter(Boolean);if(ss.length)a.push({wid:w.id,date:w.date,t:pd(w.date).getTime(),created:w.created,vol:sum(ss.map(s=>s.vol)),reps:sum(ss.map(s=>s.reps)),n:sum(ss.map(s=>s.n)),nex:ss.length,sample:!!w.sample,parts:ss})});
  a.sort((x,y)=>x.t-y.t||x.created-y.created); return _c.as=a}
function PR(){ if(_c.pr)return _c; const ev=[],by=new Map();
  SX().forEach((arr,exId)=>{const e=EM.get(exId);const bw=e&&e.type==='bodyweight';const b={top:0,e1:0,reps:0,vol:0};
    arr.forEach((s,i)=>{const chk=(k,type,v,fmt)=>{if(v>b[k]+1e-9){if(i>0&&b[k]>0){const o={exId,wid:s.wid,date:s.date,t:s.t,created:s.created,type,v,prev:b[k],fmt,sample:s.sample};ev.push(o);if(!by.has(s.wid))by.set(s.wid,[]);by.get(s.wid).push(o)}b[k]=v}};
      chk('top','Weight',s.top,fwu);chk('e1','Est. 1RM',s.e1,fwu);if(bw)chk('reps','Best set reps',s.maxReps,v=>v+' reps');chk('vol','Session volume',s.vol,fvol)})});
  ev.sort((a,b)=>b.t-a.t||b.created-a.created);_c.prl=ev;_c.prm=by;_c.pr=1;return _c}
const prList=()=>PR().prl, prByW=()=>PR().prm;
function wstats(w){const ss=w.entries.map(en=>sessionOf(w,en)).filter(Boolean);return{sets:sum(ss.map(s=>s.n)),reps:sum(ss.map(s=>s.reps)),vol:sum(ss.map(s=>s.vol)),nex:ss.length,prs:(prByW().get(w.id)||[]).length}}
const lastSess=exId=>{const a=SX().get(exId);return a&&a[a.length-1]};
function setStr(e,s){return e&&e.type==='bodyweight'?(s.w>0?`+${fw(s.w)}${cfg.unit} × ${s.r}`:`${s.r} reps`):`${fw(s.w)} × ${s.r}`}

/* ============ metrics / series ============ */
const METRICS={
  e1rm:{name:'Est. 1RM',f:s=>s.e1||null,agg:'max',kg:true,fmt:fwu},
  top:{name:'Top weight',f:s=>s.top||null,agg:'max',kg:true,fmt:fwu},
  vol:{name:'Volume',f:s=>s.vol||null,agg:'sum',kg:true,fmt:fvol},
  reps:{name:'Total reps',f:s=>s.reps||null,agg:'sum',kg:false,fmt:v=>Math.round(v).toLocaleString()+' reps'},
  best:{name:'Best set reps',f:s=>s.maxReps||null,agg:'max',kg:false,fmt:v=>v+' reps'}
};
const RANGES={'1W':7,'1M':30,'3M':91,'6M':182,'1Y':365,'ALL':0};
const rangeStart=r=>RANGES[r]?new Date(todayStr()+'T00:00').getTime()-(RANGES[r]-1)*DAY:null;
function groupPts(sess,m,g){
  const map=new Map();
  sess.forEach(s=>{const v=m.f(s);if(v==null||!(v>0))return;
    const k=g==='session'?s.wid+(s.exId||''):g==='week'?iso(mon(pd(s.date))):s.date.slice(0,7);
    if(!map.has(k))map.set(k,{k,list:[],vs:[]});const o=map.get(k);o.list.push(s);o.vs.push(v)});
  const pts=[...map.values()].map(o=>{const v=m.agg==='sum'?sum(o.vs):Math.max(...o.vs);const t=Math.max(...o.list.map(s=>s.t));
    const label=g==='session'?fdate(o.list[0].date):g==='week'?'Week of '+fshort(iso(mon(pd(o.list[0].date)))):pd(o.list[0].date).toLocaleDateString(undefined,{month:'long',year:'numeric'});
    return{t,v,dv:m.kg?toDisp(v):v,list:o.list,label}});
  pts.sort((a,b)=>a.t-b.t);
  let run=0;pts.forEach((p,i)=>{p.ath=false;if(p.v>run+1e-9){p.ath=i>0;run=p.v}});
  return pts;
}
function groupSessions(sess,g){ // for breakdown table
  const map=new Map();
  sess.forEach(s=>{const k=g==='workout'?s.wid:g==='week'?iso(mon(pd(s.date))):s.date.slice(0,7);if(!map.has(k))map.set(k,{k,date:s.date,w:new Set(),sets:0,reps:0,vol:0,top:0,e1:0,nex:0});
    const o=map.get(k);o.w.add(s.wid);o.sets+=s.n;o.reps+=s.reps;o.vol+=s.vol;o.top=Math.max(o.top,s.top||0);o.e1=Math.max(o.e1,s.e1||0);o.nex+=s.nex||1;if(s.date>o.date)o.date=s.date});
  return [...map.values()].sort((a,b)=>a.date<b.date?1:-1);
}

/* ============ charts ============ */
function shortN(v){const a=Math.abs(v);return a>=10000?Math.round(v/1000)+'k':a>=1000?(v/1000).toFixed(1)+'k':a>=100?Math.round(v)+'':(Math.round(v*10)/10)+''}
function lineChart(host,pts,o){
  if(!pts.length){host.innerHTML='<div class="empty">No data in this range yet.</div>';return}
  const W=Math.max(300,Math.floor(host.clientWidth||640)),H=W<520?240:320,P={l:46,r:14,t:16,b:26};
  const ys=pts.map(p=>p.dv);let hi=Math.max(...ys),lo=Math.min(...ys);
  if(o.ath!=null&&o.ath<=hi*1.25+1e-9)hi=Math.max(hi,o.ath);
  if(hi===lo){const d=Math.abs(hi)*.1||1;hi+=d;lo-=d}
  const pad=(hi-lo)*.14;hi+=pad;lo-=pad;if(lo<0&&Math.min(...ys)>=0)lo=0;
  const t0=pts[0].t,t1=pts[pts.length-1].t,iw=W-P.l-P.r;
  const X=t=>t1===t0?P.l+iw/2:P.l+(t-t0)/(t1-t0)*iw;
  const Y=v=>P.t+(1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  const up=pts[pts.length-1].dv>=pts[0].dv,col=up?'var(--up)':'var(--down)';
  let g='';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="grid"/><text x="${P.l-6}" y="${(y+4).toFixed(1)}" class="ax" text-anchor="end">${shortN(v)}</text>`}
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+','+Y(p.dv).toFixed(1)).join('');
  const area=d+`L${X(t1).toFixed(1)},${H-P.b}L${X(t0).toFixed(1)},${H-P.b}Z`;

function weekBuckets(n,fn){ // last n weeks oldest->newest

  return out.map(k=>({...k,v:fn(k.a,k.b)}))}
function monthBuckets(n,fn){const now=new Date();const out=[];for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()+1,1);out.push({a:iso(d),b:iso(e),label:d.toLocaleDateString(undefined,{month:'short'}),long:d.toLocaleDateString(undefined,{month:'long',year:'numeric'}),v:fn(iso(d),iso(e))})}return out}

/* ============ sample + legacy data ============ */
function mkSample(){
  const defs=[['Bench Press','weighted'],['Back Squat','weighted'],['Deadlift','weighted'],['Overhead Press','weighted'],['Barbell Row','weighted'],['Pull-Ups','bodyweight'],['Push-Ups','bodyweight']];
  const exs=defs.map(([name,type])=>({id:uid(),name,type,sample:true,created:Date.now()}));const id=n=>exs.find(e=>e.name===n).id;
  let seed=1337;const rnd=()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=(t+Math.imul(t^t>>>7,61|t))^t;return((t^t>>>14)>>>0)/4294967296};
  const plan=[{d:0,t:'Push day',l:[['Bench Press',135,2.5,[8,8,7]],['Overhead Press',85,1.25,[8,8,6]],['Push-Ups',0,0,[22,18,15]]]},
              {d:2,t:'Pull day',l:[['Deadlift',185,5,[5,5,5]],['Barbell Row',115,2.5,[8,8,8]],['Pull-Ups',0,0,[8,7,6]]]},
              {d:4,t:'Leg day',l:[['Back Squat',155,5,[6,6,6]],['Bench Press',115,2,[10,10,8]]]}];
  const ws=[];const m0=mon(new Date());const t0=todayStr();
  for(let wi=0;wi<14;wi++)plan.forEach(p=>{const date=iso(addD(m0,-7*(13-wi)+p.d));if(date>t0||rnd()<.1)return;
    const deload=wi===9?.9:1;const entries=p.l.map(([n,base,inc,reps])=>{const lb=Math.round((base+inc*wi)*deload*(1+(rnd()-.5)*.02)/2.5)*2.5;
      const sets=reps.map((r,k)=>({w:n.endsWith('Ups')||n==='Push-Ups'?0:Math.round(lb/KG*1000)/1000,r:Math.max(1,r+(n==='Pull-Ups'?Math.floor(wi/4):0)+(rnd()<.25?-1:0)),done:true}));
      return{exId:id(n),note:rnd()<.08?'Felt strong':'',sets}});
    ws.push({id:uid(),date,title:p.t,notes:'',entries,created:pd(date).getTime()+9*36e5,updated:Date.now(),sample:true})});
  return{exs,ws}}
async function loadSample(){const{exs,ws}=mkSample();await dbPutMany('exercises',exs);await dbPutMany('workouts',ws);ex.push(...exs);wk.push(...ws);cfg.includeSample=true;await saveCfg();dirty()}
async function deleteSample(){
  const sw=wk.filter(w=>w.sample).map(w=>w.id);await dbDelMany('workouts',sw);wk=wk.filter(w=>!w.sample);
  const used=new Set(wk.flatMap(w=>w.entries.map(e=>e.exId)));const drop=[];
  ex.forEach(e=>{if(e.sample){if(used.has(e.id))e.sample=false;else drop.push(e.id)}});
  await dbPutMany('exercises',ex.filter(e=>!e.sample&&!drop.includes(e.id)));await dbDelMany('exercises',drop);ex=ex.filter(e=>!drop.includes(e.id));
  cfg.includeSample=true;await saveCfg();dirty();if(draft&&draft.entries.some(e=>!EM.has(e.exId)))draft.entries=draft.entries.filter(e=>EM.has(e.exId));cmp=[];ES.sel=null;if(!EM.has(AS.ex))AS.ex=null}
function readLegacy(){try{const d=JSON.parse(localStorage.getItem('gymtracker.v1')||'null');return d&&Array.isArray(d.logs)&&d.logs.length?d:null}catch{return null}}
function convLegacy(L){ // returns {exs,ws} from classic v1 format; weights in L.unit
  const toK=v=>Math.round((L.unit==='kg'?v:v/KG)*1000)/1000;const byName=new Map(ex.filter(e=>!e.sample).map(e=>[e.name.toLowerCase(),e]));const exs=[];
  const get=n=>{let e=byName.get(n.toLowerCase());if(!e){e={id:uid(),name:n,type:'weighted',sample:false,created:Date.now()};byName.set(n.toLowerCase(),e);exs.push(e)}return e};
  (L.exercises||[]).forEach(get);const days=new Map();
  L.logs.forEach(l=>{if(!days.has(l.date))days.set(l.date,[]);days.get(l.date).push(l)});
  const ws=[...days.entries()].map(([date,ls])=>({id:'legacy-'+date,date,title:'',notes:'',created:pd(date).getTime()+ (ls[0].id%1000),updated:Date.now(),sample:false,
    entries:ls.map(l=>({exId:get(l.ex).id,note:'',sets:l.sets.map(s=>({w:toK(+s.w||0),r:Math.max(1,parseInt(s.r)||1),done:true}))}))}));
  return{exs,ws,unit:L.unit}}
async function importLegacy(L){const c=convLegacy(L);await dbPutMany('exercises',c.exs);await dbPutMany('workouts',c.ws);ex.push(...c.exs);wk.push(...c.ws);cfg.unit=c.unit==='kg'?'kg':'lb';cfg.includeSample=false;await saveCfg();dirty();return c.ws.length}

function csvEsc(v){v=String(v==null?'':v);return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCSV(){const u=cfg.unit;const rows=[['Date','Workout','Exercise','Type','Set','Weight ('+u+')','Reps','Completed','Effective load ('+u+')','Volume ('+u+')','Est 1RM ('+u+')','Exercise notes','Workout notes','Sample data']];
  vis().forEach(w=>w.entries.forEach(en=>{const e=EM.get(en.exId);en.sets.forEach((s,i)=>{const l=loadOf(e,s),done=s.done!==false,x=done?e1(l,s.r):null;
    rows.push([w.date,w.title,e?e.name:'',e?e.type:'',i+1,r2(toDisp(s.w)),s.r,done?'yes':'no',r2(toDisp(l)),done?r2(toDisp(l)*s.r):0,x?r2(toDisp(x)):'',en.note,w.notes,w.sample?'yes':'no'])})}));
  download('workout-history-'+todayStr()+'.csv','﻿'+rows.map(r=>r.map(csvEsc).join(',')).join('\r\n'),'text/csv');toast('CSV exported ('+(rows.length-1)+' sets)','ok')}
function exportJSON(){download('gym-tracker-backup-'+todayStr()+'.json',JSON.stringify({app:'gym-tracker',v:2,cfg,exercises:ex,workouts:wk},null,1),'application/json')}
async function importJSON(file){
  try{const d=JSON.parse(await file.text());let addedW=0;
    if(d.app==='gym-tracker'&&Array.isArray(d.workouts)){const ids=new Set(ex.map(e=>e.id)),wids=new Set(wk.map(w=>w.id));const ne=d.exercises.filter(e=>e&&e.id&&e.name&&!ids.has(e.id));const nw=d.workouts.filter(w=>w&&w.id&&w.date&&Array.isArray(w.entries)&&!wids.has(w.id));
      await dbPutMany('exercises',ne);await dbPutMany('workouts',nw);ex.push(...ne);wk.push(...nw);addedW=nw.length}
    else if(Array.isArray(d.logs)){const c=convLegacy(d);const wids=new Set(wk.map(w=>w.id));const nw=c.ws.filter(w=>!wids.has(w.id));await dbPutMany('exercises',c.exs);await dbPutMany('workouts',nw);ex.push(...c.exs);wk.push(...nw);addedW=nw.length}
    else throw new Error('Unrecognised file');
    dirty();toast(`Imported ${addedW} new workout${addedW===1?'':'s'} (duplicates skipped)`,'ok');render(false)}
  catch(e){toast('Import failed: '+e.message,'err')}}

  try{idb=await openDB()}catch(err){document.body.innerHTML='<div style="padding:30px;color:#ff5d5d">This browser blocked local database storage, so data cannot be saved. Try a normal (non-private) window.</div>';return}
  ex=await getAll('exercises');wk=await getAll('workouts');const meta=await getAll('meta');const c=meta.find(m=>m.k==='cfg');
  if(c)cfg={...cfg,...c.v};
  dirty();
  if(!c){const L=readLegacy();let n=0;if(L)n=await importLegacy(L);else await loadSample();await saveCfg();if(n)setTimeout(()=>toast(`Imported ${n} workouts from the earlier tracker`,'ok'),400)}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}
  try{const d=JSON.parse(localStorage.getItem('gt.draft')||'null');draft=d&&Array.isArray(d.entries)?d:newDraft();draft.entries=draft.entries.filter(e=>EM.has(e.exId))}catch{draft=newDraft()}
  const r=location.hash.slice(1);route=ROUTES[r]?r:'dashboard';
  render(false);
})();
</script>
