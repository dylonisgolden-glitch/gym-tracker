<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Tracker</title>
<style>
:root{--bg:#0b0f14;--card:#141b24;--line:#223041;--txt:#e6edf3;--dim:#7d8b9a;--up:#22c55e;--down:#ef4444;--acc:#38bdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,Segoe UI,sans-serif;padding-bottom:40px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:18px;margin:0;letter-spacing:.5px}
nav{display:flex;gap:6px}
button,select,input{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{cursor:pointer}
button.on{background:var(--acc);color:#04202e;border-color:var(--acc);font-weight:600}
button.go{background:var(--acc);color:#04202e;border-color:var(--acc);font-weight:600}
button.x{padding:4px 8px;color:var(--dim)}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.dim{color:var(--dim)}
.up{color:var(--up)}.down{color:var(--down)}
.big{font-size:28px;font-weight:700}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:12px}
input[type=number]{width:80px}
.sets input{width:70px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.tile:hover{border-color:var(--acc)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
svg{width:100%;height:auto;display:block}
.hide{display:none}
h2{font-size:15px;margin:0 0 10px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
</style>
</head>
<body>
<header>
  <h1>GYM TRACKER</h1>
  <nav>
    <button data-t="log" class="on">Week</button>
    <button data-t="trends">Trends</button>
    <button data-t="setup">Exercises</button>
  </nav>
</header>
<main>

<section id="log">
  <div class="card row">
    <button id="prev">&larr;</button>
    <div class="grow" style="text-align:center"><b id="wlabel"></b><div class="dim" id="wsub"></div></div>
    <button id="next">&rarr;</button>
    <button id="thisweek">Today</button>
  </div>
  <div class="card">
    <h2>Log a set</h2>
    <div class="row">
      <input type="date" id="ldate">
      <select id="lex" class="grow"></select>
    </div>
    <div class="sets" id="setrows" style="margin-top:10px"></div>
    <div class="row" style="margin-top:10px">
      <button id="addset">+ Set</button>
      <button id="copyprev" title="Fill from your last session">Copy last session</button>
      <span class="grow"></span>
      <button class="go" id="save">Save workout</button>
    </div>
    <div class="dim" id="suggest" style="margin-top:8px"></div>
  </div>
  <div class="card"><h2>This week</h2><div id="weeklist"></div></div>
</section>

<section id="trends" class="hide">
  <div class="card row">
    <select id="texr" class="grow"></select>
    <select id="tmet">
      <option value="e1rm">Est. 1-rep max</option>
      <option value="top">Top weight</option>
      <option value="vol">Weekly volume</option>
      <option value="reps">Total reps</option>
    </select>
    <select id="trng">
      <option value="4">4 weeks</option>
      <option value="8">8 weeks</option>
      <option value="12" selected>12 weeks</option>
      <option value="26">26 weeks</option>
      <option value="0">All</option>
    </select>
  </div>
  <div class="card">
    <div class="row"><div><div class="dim" id="tname"></div><div class="big" id="tval"></div></div><div class="grow"></div><div style="text-align:right"><div class="dim">Change</div><div class="big" id="tchg"></div></div></div>
    <div id="chart"></div>
  </div>
  <div class="card"><h2>Overall progress</h2><div class="tiles" id="tiles"></div></div>
  <div class="card"><h2>Total weekly volume (all exercises)</h2><div id="chart2"></div></div>
</section>

<section id="setup" class="hide">
  <div class="card">
    <h2>Your exercises</h2>
    <div class="row"><input id="newex" placeholder="e.g. Bench Press" class="grow"><button class="go" id="addex">Add</button></div>
    <div id="exlist" style="margin-top:10px"></div>
  </div>
  <div class="card">
    <h2>Settings</h2>
    <div class="row"><span>Units</span><select id="unit"><option>lb</option><option>kg</option></select>
    <span class="grow"></span><button id="export">Export backup</button><button id="import">Import</button></div>
    <input type="file" id="file" class="hide" accept=".json">
  </div>
</section>

</main>
<script>
const KEY='gymtracker.v1';
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{unit:'lb',exercises:['Bench Press','Squat','Deadlift','Overhead Press'],logs:[]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=id=>document.getElementById(id);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const monday=d=>{const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const e1rm=(w,r)=>r<=1?w:w*(1+r/30);
const fmt=n=>Math.round(n*10)/10;
let weekStart=monday(new Date());

// tabs
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['log','trends','setup'].forEach(t=>$(t).classList.toggle('hide',t!==b.dataset.t));
  render();
});

function fillExSelects(){
  const opts=S.exercises.map(e=>`<option>${e}</option>`).join('');
  const a=$('lex').value,b=$('texr').value;
  $('lex').innerHTML=opts;$('texr').innerHTML=opts;
  if(S.exercises.includes(a))$('lex').value=a;
  if(S.exercises.includes(b))$('texr').value=b;
}

// ---- week / log ----
function setRow(w='',r=''){
  const d=document.createElement('div');d.className='row';d.style.marginBottom='6px';
  d.innerHTML=`<span class="dim set-n"></span><input type="number" step="any" placeholder="${S.unit}" value="${w}"> &times; <input type="number" placeholder="reps" value="${r}"><button class="x">&times;</button>`;
  d.querySelector('button').onclick=()=>{d.remove();renumber()};
  $('setrows').appendChild(d);renumber();
}
function renumber(){[...$('setrows').children].forEach((d,i)=>d.querySelector('.set-n').textContent='Set '+(i+1))}
function lastSession(ex){
  const l=S.logs.filter(x=>x.ex===ex).sort((a,b)=>b.date.localeCompare(a.date))[0];return l;
}
function suggest(){
  const l=lastSession($('lex').value);
  if(!l){$('suggest').textContent='No history for this lift yet.';return}
  const top=Math.max(...l.sets.map(s=>s.w));
  const reps=l.sets.filter(s=>s.w===top).map(s=>s.r);
  const bump=S.unit==='kg'?2.5:5;
  $('suggest').textContent=`Last (${l.date}): ${l.sets.map(s=>s.w+'x'+s.r).join(', ')}. `+(Math.min(...reps)>=8?`All reps at ${top} hit 8+, so try ${top+bump} ${S.unit}.`:`Aim to beat ${Math.max(...reps)} reps at ${top} ${S.unit} before adding weight.`);
}
$('lex').onchange=suggest;
$('addset').onclick=()=>{const k=$('setrows').lastElementChild;setRow(k?k.querySelectorAll('input')[0].value:'',k?k.querySelectorAll('input')[1].value:'')};
$('copyprev').onclick=()=>{const l=lastSession($('lex').value);if(!l)return;$('setrows').innerHTML='';l.sets.forEach(s=>setRow(s.w,s.r))};
$('save').onclick=()=>{
  const sets=[...$('setrows').children].map(d=>{const i=d.querySelectorAll('input');return{w:parseFloat(i[0].value),r:parseInt(i[1].value)}}).filter(s=>s.w>=0&&s.r>0);
  if(!sets.length||!$('lex').value)return;
  S.logs.push({id:Date.now(),date:$('ldate').value,ex:$('lex').value,sets});
  save();$('setrows').innerHTML='';setRow();setRow();setRow();suggest();render();
};
$('prev').onclick=()=>{weekStart=addDays(weekStart,-7);renderWeek()};
$('next').onclick=()=>{weekStart=addDays(weekStart,7);renderWeek()};
$('thisweek').onclick=()=>{weekStart=monday(new Date());$('ldate').value=iso(new Date());renderWeek()};

function renderWeek(){
  const end=addDays(weekStart,6),a=iso(weekStart),b=iso(end);
  const opt={month:'short',day:'numeric'};
  $('wlabel').textContent=weekStart.toLocaleDateString(undefined,opt)+' - '+end.toLocaleDateString(undefined,opt);
  const wl=S.logs.filter(x=>x.date>=a&&x.date<=b).sort((p,q)=>p.date.localeCompare(q.date));
  const vol=wl.reduce((t,l)=>t+l.sets.reduce((u,s)=>u+s.w*s.r,0),0);
  $('wsub').textContent=`${wl.length} lifts, ${fmt(vol).toLocaleString()} ${S.unit} total volume`;
  if(!wl.length){$('weeklist').innerHTML='<div class="dim">Nothing logged this week.</div>';return}
  $('weeklist').innerHTML='<table><tr><th>Day</th><th>Exercise</th><th>Sets</th><th></th></tr>'+wl.map(l=>{
    const d=parse(l.date).toLocaleDateString(undefined,{weekday:'short'});
    return `<tr><td>${d}</td><td>${l.ex}</td><td>${l.sets.map(s=>s.w+'&times;'+s.r).join(', ')}</td><td><button class="x" data-id="${l.id}">&times;</button></td></tr>`}).join('')+'</table>';
  $('weeklist').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.logs=S.logs.filter(x=>x.id!=b.dataset.id);save();render()});
}

// ---- trends ----
function weekly(ex,metric){
  // returns [{wk:Date, v:number}] per week with data
  const m=new Map();
  S.logs.filter(l=>!ex||l.ex===ex).forEach(l=>{
    const k=iso(monday(parse(l.date)));
    const cur=m.get(k)||{e:0,top:0,vol:0,reps:0};
    l.sets.forEach(s=>{cur.e=Math.max(cur.e,e1rm(s.w,s.r));cur.top=Math.max(cur.top,s.w);cur.vol+=s.w*s.r;cur.reps+=s.r});
    m.set(k,cur);
  });
  const key={e1rm:'e',top:'top',vol:'vol',reps:'reps'}[metric];
  return [...m.entries()].sort().map(([k,v])=>({wk:parse(k),v:v[key]}));
}
function chart(el,pts,unit){
  if(pts.length<1){el.innerHTML='<div class="dim" style="padding:30px 0;text-align:center">No data in this range yet.</div>';return}
  const W=800,H=280,P={l:50,r:14,t:14,b:28};
  const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);
  if(lo===hi){lo*=.9;hi=hi*1.1||1}
  const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const t0=pts[0].wk.getTime(),t1=pts[pts.length-1].wk.getTime()||t0+1;
  const X=t=>P.l+(pts.length===1?.5:(t-t0)/(t1-t0))*(W-P.l-P.r);
  const Y=v=>P.t+(1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  const up=pts[pts.length-1].v>=pts[0].v,col=up?'#22c55e':'#ef4444';
  let g='';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="#223041"/><text x="${P.l-6}" y="${y+4}" fill="#7d8b9a" font-size="11" text-anchor="end">${Math.round(v)}</text>`}
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.wk.getTime())+','+Y(p.v)).join(' ');
  const area=path+` L${X(t1)},${H-P.b} L${X(t0)},${H-P.b} Z`;
  const dots=pts.map(p=>`<circle cx="${X(p.wk.getTime())}" cy="${Y(p.v)}" r="4" fill="${col}"><title>${p.wk.toLocaleDateString(undefined,{month:'short',day:'numeric'})}: ${fmt(p.v)} ${unit}</title></circle>`).join('');
  const labs=[pts[0],pts[pts.length-1]].map((p,i)=>`<text x="${X(p.wk.getTime())}" y="${H-8}" fill="#7d8b9a" font-size="11" text-anchor="${pts.length===1?'middle':i?'end':'start'}">${p.wk.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text>`).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}<path d="${area}" fill="${col}" opacity=".12"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2.5"/>${dots}${labs}</svg>`;
}
function inRange(pts){const n=+$('trng').value;if(!n)return pts;const cut=addDays(monday(new Date()),-7*(n-1));return pts.filter(p=>p.wk>=cut)}
function chg(pts){if(pts.length<2)return null;const a=pts[0].v,b=pts[pts.length-1].v;return{d:b-a,p:a?(b-a)/a*100:0}}
function renderTrends(){
  const ex=$('texr').value,met=$('tmet').value;
  const unit=met==='reps'?'reps':S.unit;
  const pts=inRange(weekly(ex,met));
  $('tname').textContent=ex+' - '+$('tmet').selectedOptions[0].text;
  const last=pts[pts.length-1];
  $('tval').textContent=last?fmt(last.v)+' '+unit:'--';
  const c=chg(pts);
  $('tchg').innerHTML=c?`<span class="${c.d>=0?'up':'down'}">${c.d>=0?'&#9650;':'&#9660;'} ${Math.abs(fmt(c.p))}%</span>`:'<span class="dim">--</span>';
  chart($('chart'),pts,unit);
  // tiles: all exercises, e1rm change over range
  $('tiles').innerHTML=S.exercises.map(e=>{
    const p=inRange(weekly(e,'e1rm')),c=chg(p),l=p[p.length-1];
    return `<div class="tile" data-ex="${e}"><div class="dim">${e}</div><div style="font-size:20px;font-weight:600">${l?fmt(l.v)+' '+S.unit:'--'}</div><div class="${c?(c.d>=0?'up':'down'):'dim'}">${c?(c.d>=0?'&#9650; +':'&#9660; ')+fmt(c.d)+' ('+fmt(c.p)+'%)':'no trend yet'}</div></div>`}).join('');
  $('tiles').querySelectorAll('.tile').forEach(t=>t.onclick=()=>{$('texr').value=t.dataset.ex;renderTrends();scrollTo(0,0)});
  chart($('chart2'),inRange(weekly(null,'vol')),S.unit);
}
['texr','tmet','trng'].forEach(i=>$(i).onchange=renderTrends);

// ---- setup ----
function renderSetup(){
  $('exlist').innerHTML=S.exercises.map((e,i)=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--line)"><span class="grow">${e}</span><span class="pill">${S.logs.filter(l=>l.ex===e).length} logs</span><button class="x" data-i="${i}">remove</button></div>`).join('')||'<div class="dim">No exercises yet.</div>';
  $('exlist').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const e=S.exercises[b.dataset.i];
    if(S.logs.some(l=>l.ex===e)&&!confirm(e+' has logged history. Remove it from the list? (History is kept.)'))return;
    S.exercises.splice(b.dataset.i,1);save();render();
  });
  $('unit').value=S.unit;
}
$('addex').onclick=()=>{const v=$('newex').value.trim();if(v&&!S.exercises.includes(v)){S.exercises.push(v);save();$('newex').value='';render()}};
$('newex').onkeydown=e=>{if(e.key==='Enter')$('addex').click()};
$('unit').onchange=()=>{S.unit=$('unit').value;save();render()};
$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='gym-tracker-backup.json';a.click()};
$('import').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(d.logs&&d.exercises){S=d;save();render()}}catch{alert('Not a valid backup file.')}})};

function render(){fillExSelects();renderWeek();renderTrends();renderSetup();suggest()}
$('ldate').value=iso(new Date());
setRow();setRow();setRow();
render();
</script>
</body>
</html>
